[['La Commissione propone; Parlamento europeo e Consiglio la adottano insieme come colegislatori','Il Parlamento europeo propone; Commissione e Consiglio la adottano','Il Consiglio europeo propone e adotta, dopo aver consultato il Parlamento','La Commissione propone e adotta da sola; Parlamento e Consiglio sono solo consultati'],['The Commission proposes; the European Parliament and the Council adopt it together as co-legislators','The European Parliament proposes; the Commission and the Council adopt it','The European Council proposes and adopts, after consulting Parliament','The Commission proposes and adopts alone; Parliament and Council are only consulted']],
[['Corretto: nella procedura legislativa ordinaria (artt. 289 e 294 TFUE) la Commissione presenta la proposta, Parlamento e Consiglio la adottano insieme.','Il Parlamento può chiedere alla Commissione di presentare proposte (art. 225 TFUE), ma di norma non ha l’iniziativa.','Il Consiglio europeo fissa gli orientamenti politici (art. 15 TUE) e non esercita funzioni legislative.','La Commissione non adotta da sola l’atto: servono Parlamento e Consiglio, che sono colegislatori e non semplici consultati.'],['Correct: in the ordinary legislative procedure (Arts 289 and 294 TFEU) the Commission submits the proposal and Parliament and Council adopt it together.','Parliament may ask the Commission to submit proposals (Art. 225 TFEU) but normally has no right of initiative.','The European Council sets political guidelines (Art. 15 TEU) and exercises no legislative functions.','The Commission does not adopt the act alone: Parliament and Council are co-legislators, not mere consultees.']],'TEU Art. 17; TFEU Arts 289, 294'],
[['Mancato recepimento di una direttiva','Failure to transpose a directive'],3,['Uno Stato membro non recepisce una direttiva entro il termine previsto. Che cosa può fare la Commissione?','A Member State fails to transpose a directive by the deadline. What can the Commission do?'],
[['Avviare una procedura di infrazione e, se necessario, deferire lo Stato alla Corte di giustizia, che può imporre sanzioni pecuniarie','Annullare con una propria decisione la legge nazionale incompatibile','Chiedere al Consiglio europeo di sospendere il diritto di voto dello Stato','Multare lo Stato direttamente tramite il Parlamento europeo'],['Open an infringement procedure and, if necessary, refer the State to the Court of Justice, which may impose financial penalties','Annul the incompatible national law by its own decision','Ask the European Council to suspend the State’s voting rights','Fine the State directly through the European Parliament']],
[['Corretto: la Commissione, custode dei Trattati, avvia la procedura di infrazione (art. 258 TFUE); per il mancato recepimento la Corte può imporre sanzioni pecuniarie (art. 260 TFUE).','La Commissione non può annullare leggi nazionali: deve rivolgersi alla Corte di giustizia.','La sospensione dei diritti di voto riguarda violazioni gravi e persistenti dei valori dell’Unione (art. 7 TUE), non il mancato recepimento.','Il Parlamento non ha poteri sanzionatori verso gli Stati: le sanzioni pecuniarie le impone la Corte di giustizia.'],['Correct: the Commission, guardian of the Treaties, opens an infringement procedure (Art. 258 TFEU); for non-transposition the Court may impose financial penalties (Art. 260 TFEU).','The Commission cannot annul national laws: it must go to the Court of Justice.','Suspension of voting rights concerns serious and persistent breaches of Union values (Art. 7 TEU), not non-transposition.','Parliament has no power to sanction States: financial penalties are imposed by the Court of Justice.']],'TFEU Arts 258, 260; TEU Art. 7'],
[['Controllo di sussidiarietà','Subsidiarity check'],3,['I parlamenti nazionali ritengono che una proposta della Commissione in un settore di competenza concorrente violi la sussidiarietà. Quale strumento possono usare?','National parliaments consider that a Commission proposal in an area of shared competence breaches subsidiarity. Which tool can they use?'],
[['Inviare un parere motivato entro otto settimane: se rappresenta un terzo dei voti, la Commissione deve riesaminare la proposta','Porre il veto: basta un solo parlamento nazionale per bloccare la proposta','Attendere l’adozione dell’atto, perché prima non hanno alcun ruolo','Rivolgersi al Consiglio europeo, che decide sulla conformità alla sussidiarietà'],['Send a reasoned opinion within eight weeks: if they represent one third of the votes, the Commission must review the proposal','Veto it: a single national parliament is enough to block the proposal','Wait until the act is adopted, because they have no role before then','Turn to the European Council, which decides on compliance with subsidiarity']],
[['Corretto: è il meccanismo di allerta precoce del Protocollo n. 2; con un terzo dei voti (un quarto per i progetti nello spazio di libertà, sicurezza e giustizia) scatta il «cartellino giallo» e la Commissione può mantenere, modificare o ritirare la proposta.','Nessun parlamento ha un potere di veto: il cartellino giallo impone solo un riesame.','I parlamenti nazionali intervengono già sul progetto: gli viene trasmesso e il termine decorre dalla trasmissione.','Il Consiglio europeo non decide sulla sussidiarietà; il controllo giurisdizionale spetta alla Corte di giustizia.'],['Correct: this is the early warning mechanism of Protocol No 2; with one third of the votes (one quarter for drafts in the area of freedom, security and justice) the “yellow card” is triggered and the Commission may maintain, amend or withdraw the proposal.','No parliament holds a veto: the yellow card only requires a review.','National parliaments act on the draft itself: it is sent to them and the deadline runs from transmission.','The European Council does not rule on subsidiarity; judicial review belongs to the Court of Justice.']],'TEU Art. 5; Protocol No 2'],
[['Controllo dei conti e discarico','Audit and discharge'],3,['Un’inchiesta segnala presunte irregolarità nell’uso di fondi UE. Quale organo controlla i conti dell’Unione e chi decide sul discarico alla Commissione?','A report alleges irregularities in the use of EU funds. Which body audits the Union’s accounts and who decides on the discharge of the Commission?'],
[['La Corte dei conti europea controlla; il Parlamento europeo concede il discarico su raccomandazione del Consiglio','La Corte di giustizia controlla; il Consiglio europeo concede il discarico','La Banca centrale europea controlla; la Commissione si discarica da sola','La Corte dei conti europea controlla e concede anche il discarico'],['The European Court of Auditors audits; the European Parliament grants discharge on a recommendation from the Council','The Court of Justice audits; the European Council grants discharge','The European Central Bank audits; the Commission discharges itself','The European Court of Auditors audits and also grants discharge']],

[['Limiti l’accesso ai soli colleghi autorizzati con i permessi minimi necessari, revochi il link pubblico e informi il referente per la protezione dei dati','Lasci il link, perché è difficile da indovinare','Elimini il file senza dire nulla a nessuno','Invii il file come allegato a tutto il team per sicurezza'],['Restrict access to authorised colleagues with the minimum permissions needed, revoke the public link and inform the data protection contact','Leave the link, because it is hard to guess','Delete the file without telling anyone','Send the file as an attachment to the whole team to be safe']],

[['Corretto: il traffico passa su un canale protetto e l’accesso resta protetto dal secondo fattore.','HTTPS protegge il contenuto, ma una rete aperta resta esposta ad altri rischi, come reti false: VPN o hotspot riducono il rischio.','Condividere le credenziali viola le regole di sicurezza e impedisce di risalire a chi ha agito.','Spostare dati di lavoro su un account personale li sottrae al controllo dell’organizzazione.'],['Correct: traffic goes through a protected channel and access stays protected by the second factor.','HTTPS protects content, but an open network remains exposed to other risks, such as fake networks: a VPN or hotspot reduces the risk.','Sharing credentials breaks security rules and makes it impossible to trace who acted.','Moving work data to a personal account takes it out of the organisation’s control.']],'DigComp 4.1'],
[['Accessibilità','Accessibility'],2,['Prepari una presentazione pubblica per cittadini, alcuni con disabilità visive. Quale approccio la rende più accessibile?','You are preparing a public presentation for citizens, some with visual impairments. Which approach makes it most accessible?'],

{topic:'Appalti e valutazione',it:'Un’agenzia europea ha avviato una procedura per acquistare servizi di traduzione. Il bando stabilisce che il prezzo rappresenta il 40% del punteggio e la qualità il 60%. Sono ammesse soltanto offerte presentate entro il termine e accompagnate dalla documentazione richiesta. Tre imprese presentano offerte: Alfa entro il termine con documenti completi; Beta dopo la scadenza; Gamma entro il termine ma senza una dichiarazione obbligatoria. Alfa ha il prezzo più alto, ma la qualità migliore. La commissione di valutazione non ha ancora assegnato i punteggi finali. La direzione sottolinea che il criterio del prezzo più basso non coincide necessariamente con quello dell’offerta economicamente più vantaggiosa.',facts:[['Solo Alfa soddisfa esplicitamente tutti i requisiti di ammissione descritti.','Only Alfa explicitly meets all admission requirements described.',1],['Alfa vincerà sicuramente la procedura.','Alfa will definitely win the procedure.',2],['La qualità ha un peso maggiore del prezzo.','Quality carries more weight than price.',1],['Beta ha presentato la sua offerta in tempo.','Beta submitted its bid on time.',0],['Il prezzo più basso determina automaticamente il vincitore.','The lowest price automatically determines the winner.',0]]},

{topic:'Gestione documentale',it:'Un ufficio riceve ogni settimana richieste di accesso ai documenti. Le richieste vengono registrate all’arrivo e assegnate a un responsabile. Quelle incomplete richiedono chiarimenti prima di poter essere esaminate nel merito. Nel trimestre considerato, il numero di richieste è aumentato del 25% rispetto al trimestre precedente, mentre il personale addetto è rimasto invariato. Il tempo mediano di risposta è cresciuto da 12 a 15 giorni. Il rapporto osserva che l’aumento dei tempi coincide con quello del volume, ma non stabilisce che il secondo sia l’unica causa del primo.',facts:[['Il tempo mediano di risposta è aumentato di tre giorni.','Median response time increased by three days.',1],['L’aumento delle richieste è certamente l’unica causa dei tempi più lunghi.','The increase in requests is certainly the only cause of longer response times.',0],['Il personale addetto è cresciuto del 25%.','Staff increased by 25%.',0],['Una richiesta incompleta può richiedere chiarimenti prima dell’esame nel merito.','An incomplete request may require clarification before substantive examination.',1],['Il numero assoluto di richieste del trimestre precedente è noto.','The absolute number of requests in the previous quarter is known.',2]]},
{topic:'Trasporti e sostenibilità',it:'Una città sperimenta autobus elettrici su due linee urbane. La linea A ha sostituito tutti i mezzi diesel; la linea B ne ha sostituito soltanto la metà. I consumi energetici vengono misurati in entrambe le linee, ma i dati relativi alla produzione dell’elettricità non sono ancora disponibili. Nel primo mese i reclami per rumore sulla linea A sono diminuiti, mentre sulla linea B sono rimasti stabili. Gli analisti avvertono che un mese di osservazione non basta a determinare l’effetto a lungo termine e che la diminuzione dei reclami non misura direttamente il livello di emissioni.',facts:[['Sulla linea A tutti i mezzi diesel sono stati sostituiti.','On line A all diesel vehicles were replaced.',1],['Le emissioni complessive del sistema sono già state misurate integralmente.','The system’s total emissions have already been fully measured.',0],['I reclami per rumore sono diminuiti sulla linea A.','Noise complaints decreased on line A.',1],['Il programma avrà certamente lo stesso effetto sul rumore per dieci anni.','The programme will certainly have the same noise effect for ten years.',2],['La linea B ha sostituito più mezzi della linea A in termini assoluti.','Line B replaced more vehicles than line A in absolute terms.',2]]},
{topic:'Cybersecurity e formazione',it:'Un’istituzione ha introdotto un corso obbligatorio sulla sicurezza informatica. Entro la data prevista, l’85% dei dipendenti lo ha completato. Tra chi ha completato il corso, il 70% ha superato un test finale al primo tentativo. L’istituzione ha inoltre attivato l’autenticazione multifattore per tutti gli account amministrativi, ma non ancora per tutti gli account ordinari. Il rapporto raccomanda ulteriori misure e precisa che il completamento del corso non costituisce, da solo, una prova della riduzione degli incidenti.',facts:[['Almeno una parte dei dipendenti non ha completato il corso entro la data prevista.','At least some staff did not complete the course by the deadline.',1],['Tutti gli account ordinari hanno già l’autenticazione multifattore.','All ordinary accounts already have multi-factor authentication.',0],['Il 70% di tutti i dipendenti ha superato il test al primo tentativo.','70% of all staff passed the test on their first attempt.',2],['Tutti gli account amministrativi sono coperti dall’autenticazione multifattore.','All administrative accounts are covered by multi-factor authentication.',1],['La formazione ha già dimostrato una riduzione degli incidenti.','Training has already demonstrated a reduction in incidents.',0]]},

const MENTAL_MATH=[
["Percentuali senza moltiplicazioni lunghe","10% = sposta la virgola di una posizione; 5% = metà del 10%; 1% = dividi per 100; 15% = 10% + 5%; 25% = un quarto; 12,5% = un ottavo.","15% di 240: 10%=24 e 5%=12, quindi 36. Il 12,5% di 320 è 320÷8=40.","Non calcolare 240×0,15: scomponi la percentuale."],
["Frazioni equivalenti e cancellazione","Semplifica prima di moltiplicare: 18/24 = 3/4. Per calcolare (36×25)/100, riduci 25/100 a 1/4.","36×25÷100 = 36÷4 = 9. Il 75% di 80 è 3/4 di 80 = 60.","Cerca divisori comuni 2, 4, 5, 10 e 25."],
["Variazioni percentuali in pochi secondi","Per passare da A a B, trova prima la differenza. Poi chiediti quale frazione del valore iniziale rappresenta.","Da 80 a 100: differenza 20; 20/80=1/4=25%. Da 120 a 90: −30/120=−1/4=−25%.","Il denominatore è sempre il valore iniziale, non quello finale."],
["Calcolo inverso delle percentuali","Se un prezzo dopo lo sconto del 20% è 64, il valore finale è 80% dell'originale, cioè 4/5. Moltiplica per 5 e dividi per 4.","64÷4×5 = 80. Se il 75% vale 150, il 25% vale 50 e il 100% vale 200.","Evita di sommare il 20% al valore scontato: non ripristina il prezzo iniziale."],
["Medie ponderate con bilanciamento","Se i gruppi sono di dimensione diversa, parti dal valore medio del gruppo maggiore e aggiusta con la differenza pesata.","30 persone hanno media 6 e 10 persone media 8: parti da 6; l'aumento è (10/40)×(8−6)=0,5; media totale 6,5.","Il risultato deve stare tra le due medie ed essere più vicino a quella del gruppo numeroso."],
["Moltiplicazioni rapide e numeri vicini","Moltiplica per 5 dimezzando ×10; per 25 dividi per 4 e moltiplica per 100; per 9 usa ×10 meno il numero; per 11 usa ×10 più il numero.","48×25 = (48÷4)×100 = 1200. 37×9 = 370−37 = 333.","Arrotonda per controllare l'ordine di grandezza prima di scegliere."],
["Rapporti e proporzioni","Riduci un rapporto a numeri piccoli e usa il fattore di scala. Se 3 unità costano 12, una costa 4 e 7 costano 28.","Per 18 su 60: dividi entrambi per 6, ottieni 3/10 = 30%.","Non usare prodotti incrociati se una divisione semplice basta."],
["Stima ed eliminazione delle alternative","Prima di fare il conto esatto, stima con numeri tondi e verifica segno, unità e intervallo plausibile. È utile soprattutto nelle domande a scelta multipla.","19% di 198 è poco meno del 20% di 200 = 40; il risultato esatto è 37,62. Elimina subito opzioni come 4 o 400.","Usa la stima per escludere; se due opzioni sono vicine, completa il calcolo esatto."],
["Crescita composta a mente","Per pochi periodi, aggiorna il capitale uno step alla volta. Per il 10% usa la divisione per 10, poi somma.","100 → 110 → 121 in due anni al 10%. Con 200 al 5%: 200 → 210 → 220,5.","Non sostituire la crescita composta con tasso × anni quando serve precisione."],
["Gestione del tempo e carta mentale","Leggi prima cosa viene richiesto, annota mentalmente unità e base, cerca una semplificazione, stima, calcola e controlla. Se il calcolo diventa lungo, verifica le opzioni.","Per il 35% di 160: 1/4=40 e 10%=16; 25%+10%=56.","Allenati senza calcolatrice: queste strategie non sostituiscono eventuali regole ufficiali sull'uso di carta o strumenti."]
];

else if(a=="xn"){X.i=+b.dataset.i}
else if(a=="xend"){X=null}
else if(a=="xsub"){if(X&&!X.done){X.done=true;const t=Math.round((Date.now()-X.t0)/1000/X.qs.length);X.sc=0;X.qs.forEach((q,i)=>{const o=q.opts.find(x=>x.id==X.a[i]);if(!o)return;if(o.ok)X.sc++;P.h.push({fp:q.fp,pat:q.pat,cat:q.cat,sub:q.sub,d:q.d,ok:o.ok,t,ts:Date.now()});P.seen[q.fp]=1;P.pat[q.pat]=(P.pat[q.pat]||0)+1;{const k=q.cat+"|"+q.sub,old=P.review[k]||{stage:0};const stage=o.ok?Math.min(5,old.stage+1):0;P.review[k]={stage,due:Date.now()+[1,2,4,7,14,30][stage]*864e5};}if(!o.ok)P.m.push({cat:q.cat,sub:q.sub,stem:q.stem+(q.data||""),ans:o.h,corr:q.opts.find(x=>x.ok).h,why:q.why,ts:Date.now()})})}}
else if(a=="lang"){P.l1=b.value==="en"?"en":"it";P.l2=P.l1;msg="Lingua aggiornata. I nuovi quiz useranno "+(P.l1==="en"?"l’inglese":"l’italiano")+"."}
else if(a=="fld"){P[b.dataset.f]=b.dataset.f=="tg"?+b.value||30:b.value}
else if(a=="reset"){if(rc){P.h=[];P.m=[];P.seen={};P.pat={};P.review={};rc=0}else rc=1}
else if(a=="imp"){try{const j=JSON.parse($("#im").value);if(j.v!==1||!Array.isArray(j.ps)||!j.ps.length||j.ps.some(p=>typeof p.name!="string"||!Array.isArray(p.h)))throw 0;S=j;S.ps=[S.ps[0]];S.cur=0;S.ps[0].l1=S.ps[0].l1==="en"?"en":"it";S.ps[0].l2=S.ps[0].l2==="en"?"en":"it";msg="Importazione riuscita.";Q=null}catch(e){msg="JSON non valido: nessun dato modificato."}}
save();render()}

// Intensive preparation layer — offline and per-browser.
const INT_CATS=['ver','num','abs','eu','dig'];
function intStats(P,c){const a=P.h.filter(x=>x.cat===c),recent=a.slice(-12),accuracy=recent.length?recent.filter(x=>x.ok).length/recent.length:0.5,mean=recent.length?recent.reduce((v,x)=>v+x.t,0)/recent.length:0;return {n:a.length,accuracy,mean};}
function intPriority(P,c){const z=intStats(P,c),due=Object.entries(P.review||{}).some(([k,v])=>k.startsWith(c+'|')&&v.due<=Date.now());return (1-z.accuracy)*65+Math.max(0,8-z.n)*3+(due?18:0)+Math.min(12,z.mean/15);}
function intRank(P){return INT_CATS.slice().sort((a,b)=>intPriority(P,b)-intPriority(P,a));}
function intCard(P){const ranking=intRank(P),h=P.h,ex=P.ex?Math.ceil((new Date(P.ex)-Date.now())/864e5):null,first=h.length<12,minutes=P.tg||30;
return `<div class="card" style="border:2px solid var(--ac)"><h2>Preparazione intensiva</h2><p>${first?'Inizia con una diagnosi breve su tutte le aree. Dopo 12 risposte il programma diventa personalizzato.':`Priorità attuale: <b>${CATS[ranking[0]]}</b>. Le aree sono ordinate in base a errori recenti, volume di pratica, tempo e ripassi in scadenza.`}</p><p>Tempo quotidiano: <b>${minutes} minuti</b>${ex!==null&&!isNaN(ex)?` · Giorni all’esame: <b>${ex}</b>`:''}.</p><div class="row"><button class="p" data-a="intstart">${first?'Avvia diagnosi iniziale':'Inizia la sessione di oggi'}</button><button data-a="intdiag">Apri diagnostica</button></div><p class="mu">Il piano è una guida euristica basata sui risultati locali, non una previsione EPSO. Ogni set è limitato alle domande effettivamente disponibili.</p></div>`;}
function intDiag(P){const rank=intRank(P),target={ver:105,num:120,abs:60,eu:80,dig:45};return `<div class="card"><h2>Diagnostica operativa</h2><p class="mu">Tempi obiettivo orientativi, non limiti ufficiali. Le percentuali con pochi tentativi hanno scarsa affidabilità.</p><div class="w"><table><tr><th>Area</th><th>Tentativi</th><th>Corrette</th><th>Tempo medio</th><th>Intervento</th></tr>${rank.map(c=>{const z=intStats(P,c);return `<tr><td>${CATS[c]}</td><td>${z.n}</td><td>${Math.round(z.accuracy*100)}%${z.n<5?'*':''}</td><td>${z.n?Math.round(z.mean)+' s':'—'}</td><td>${z.n<5?'Raccogli più dati':z.accuracy<.65?'Microlezione + esercizi guidati':z.mean>target[c]?'Allenamento a tempo':'Mantenimento e ripasso'}</td></tr>`}).join('')}</table></div><p class="mu">* Stima preliminare; le domande non hanno difficoltà psicometrica calibrata.</p><div class="row"><button class="p" data-a="intstart">Allenati sulle priorità</button><button data-a="intback">Dashboard</button></div></div>`;}
let intShowDiag=false,intMode='',intQueue=[];
const intOldDash=dash;dash=function(P){return intCard(P)+(intShowDiag?intDiag(P):'')+intOldDash(P)};
const intOldDaily=daily;daily=function(P){const rank=intRank(P),c=rank[0];return `<div class="card"><h2>Piano adattivo · ${P.tg||30} minuti</h2><p>1. Ripasso (5 min). 2. Allenamento mirato: ${CATS[c]} (12 min). 3. Domande miste (8 min). 4. Correzione e strategia (5 min).</p><p class="mu">La durata è una ripartizione consigliata; non blocca automaticamente la sessione.</p><button class="p" data-a="intstart">Inizia il percorso</button></div>`+intOldDaily(P)};
function intGenerate(P){const initial=P.h.length<12,rank=initial?INT_CATS:intRank(P),set=[],fps=new Set();const allocation=initial?[3,3,3,3,3]:[5,3,2,2,2];for(let i=0;i<rank.length;i++){const c=rank[i],qs=build(c,0,allocation[i]);for(const q of qs){if(!fps.has(q.fp)){fps.add(q.fp);set.push(q)}}}return set;}
const intOldAct=act;act=function(a,b){const P=cur();if(a==='intdiag'){intShowDiag=!intShowDiag;view='dash';render();return}if(a==='intback'){intShowDiag=false;view='dash';render();return}if(a==='intstart'){intShowDiag=false;const set=intGenerate(P);if(!set.length){msg='Non sono disponibili esercizi validi: prova un allenamento manuale.';view='train';render();return}intMode='intensive';view='train';X=null;Q=null;begin(set);msg=`Sessione ${P.h.length<12?'diagnostica':'adattiva'}: ${set.length} quesiti disponibili.`;render();return}intOldAct(a,b);};
const intOldQuiz=quiz;quiz=function(P){const content=intOldQuiz(P);if(!Q||!intMode)return content;const q=Q.set[Q.i];const tip=Q.done?`<div class="card"><h3>Microlezione: ${esc(q.sub)}</h3><p><b>Procedimento:</b> ${esc(q.fast||q.why||'Rileggi i dati e verifica la conclusione.')}</p><p><b>Errore da evitare:</b> ${esc(q.mist||'Non introdurre assunzioni non presenti nel quesito.')}</p><p class="mu">Per consolidare, spiega il procedimento a voce prima di proseguire.</p></div>`:'';return `<div class="card"><b>${intMode==='intensive'?'Sessione intensiva':'Allenamento'}</b> · Quesito ${Q.i+1}/${Q.set.length} · ${CATS[q.cat]}</div>`+content+tip;};

document.addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(b)act(b.dataset.a,b)});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.a&&t.tagName!="BUTTON")act(t.dataset.a,t)});
render();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
